<h1>Conditions de réservation et d’annulation</h1>
<p>Paiement, annulation, modification : les règles à connaître avant de réserver.</p>

<main class="tf-main cg-main">
<div class="cg-grid"><nav class="cg-nav" aria-label="Sommaire"><p>Sommaire</p><ol><li><a href="#cg-reservation">Réservation</a></li><li><a href="#cg-zone">Zone d’intervention</a></li><li><a href="#cg-paiement">Paiement</a></li><li><a href="#cg-annulation">Annulation</a></li><li><a href="#cg-modification">Modification</a></li><li><a href="#cg-remboursement">Remboursement</a></li><li><a href="#cg-securite">Sécurité et santé de l’animal</a></li><li><a href="#cg-europe">Trajets en Europe</a></li></ol></nav><div class="cg-body"><section class="cg-sec" id="cg-reservation"><h2><span>1</span>Réservation</h2><ul><li>Réservation en ligne au moins <b>24 h à l’avance</b> pour un trajet local, <b>7 jours</b> pour un trajet longue distance en France et <b>15 jours</b> pour un trajet en Europe, et au plus 60 jours à l’avance.</li><li>Réservations en ligne possibles de 6 h à 20 h.</li><li>Pour une urgence ou un autre horaire, appelez le <a href="tel:+33670984055">06 70 98 40 55</a>. Les urgences sont assurées selon la disponibilité du chauffeur.</li><li>La réservation est confirmée par e-mail, avec le récapitulatif du trajet et du prix.</li></ul></section><section class="cg-sec" id="cg-zone"><h2><span>2</span>Zone d’intervention</h2><ul><li>Un trajet est local quand le trajet de votre animal, de chez vous à la destination, fait moins de 65 km. Au-delà, le tarif longue distance s’applique.</li><li>En local, la prise en charge se fait jusqu’à 50 km autour de Feurs. Au-delà, le trajet est réalisé sur devis.</li><li>Les trajets longue distance, en France et en Europe, ne sont pas concernés par cette limite.</li></ul></section><section class="cg-sec" id="cg-paiement"><h2><span>3</span>Paiement</h2><ul><li>Le prix du trajet est réglé <b>en totalité en ligne, par carte bancaire, à la réservation</b>. Il n’y a pas d’acompte.</li><li>Si l’attente sur place dépasse l’estimation, le temps supplémentaire (5&nbsp;€ par quart d’heure) est réglé à la fin de la course, par un lien de paiement envoyé par SMS.</li><li>Les frais de vétérinaire, de toilettage ou de pension sont réglés directement par vous.</li></ul></section><section class="cg-sec" id="cg-annulation"><h2><span>4</span>Annulation</h2><div class="cg-tw"><table class="cg-t"><thead><tr><th scope="col">Trajet</th><th scope="col">Annulation plus tôt</th><th scope="col">Annulation plus tard</th></tr></thead><tbody><tr><th scope="row">Trajet local</th><td>Plus de 24 h avant le départ<b>50&nbsp;% remboursés</b></td><td>Moins de 24 h avant le départ<b>Aucun remboursement</b></td></tr><tr><th scope="row">Longue distance France et Europe</th><td>Plus de 72 h avant le départ<b>70&nbsp;% remboursés</b></td><td>Moins de 72 h avant le départ<b>Aucun remboursement</b></td></tr></tbody></table></div><ul><li>Absence au moment de la prise en charge : aucun remboursement.</li><li>Annulation de notre fait (panne, indisponibilité du chauffeur) : remboursement intégral, quel que soit le délai.</li></ul></section><section class="cg-sec" id="cg-modification"><h2><span>5</span>Modification</h2><ul><li>Changement de date ou d’heure gratuit jusqu’à 24 h avant le départ (72 h pour la longue distance et l’Europe), selon nos disponibilités.</li><li>Pour modifier votre réservation, appelez le <a href="tel:+33670984055">06 70 98 40 55</a>.</li></ul></section><section class="cg-sec" id="cg-remboursement"><h2><span>6</span>Remboursement</h2><ul><li>Le remboursement est effectué sur la carte bancaire utilisée pour le paiement, sous 5 à 10 jours ouvrés selon votre banque.</li></ul></section><section class="cg-sec" id="cg-securite"><h2><span>7</span>Sécurité et santé de l’animal</h2><ul><li>Tout animal voyage dans une caisse de transport fournie par Gadomi.</li><li>Chiens de 1re et 2e catégorie acceptés avec muselière et documents légaux.</li><li>Jusqu’à 2 animaux d’un même foyer par trajet, selon leur taille.</li><li>L’animal doit être à jour de ses vaccins et ne présenter aucune maladie contagieuse. Toute maladie, blessure ou traitement en cours doit être signalé à la réservation.</li><li>En trajet local, vous pouvez accompagner votre animal (1 accompagnant offert). En longue distance et en Europe, l’animal voyage seul avec le chauffeur.</li></ul></section><section class="cg-sec" id="cg-europe"><h2><span>8</span>Trajets en Europe</h2><ul><li>L’animal doit avoir une puce électronique, un passeport européen et un vaccin antirabique valide (fait au moins 21 jours avant le départ en cas de première vaccination), ainsi que votre autorisation écrite.</li><li>Si vous ne voyagez pas dans les 5 jours avant ou après votre animal, un certificat sanitaire officiel est nécessaire, à obtenir auprès de votre vétérinaire avant la réservation.</li></ul></section>
<p class="cg-foot">TVA non applicable, art. 293 B du CGI. Conditions mises à jour le 10 novembre 2026.</p>

<script type="text/x-dc" id="dc-code">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sent: false, err: '', name: '', tel: '', mail: '', type: 'Question', animal: 'Chien', msg: '', ok: false };
  }
  renderVals() {
    var s = this.state, self = this;
    var set = function (k) { return function (e) { var o = {}; o[k] = e.target.value; self.setState(o); }; };
    return {
      sent: s.sent, notSent: !s.sent, err: s.err, hasErr: !!s.err,
      setName: set('name'), setTel: set('tel'), setMail: set('mail'), setType: set('type'), setAnimal: set('animal'), setMsg: set('msg'),
      setOk: function (e) { self.setState({ ok: e.target.checked }); },
      send: function () {
        var err = '';
        if (!s.name.trim()) err = 'Merci d’indiquer votre nom.';
        else if (!s.tel.trim() && !s.mail.trim()) err = 'Merci d’indiquer un téléphone ou un e-mail pour que je puisse vous répondre.';
        else if (s.mail.trim() && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(s.mail.trim())) err = 'L’adresse e-mail ne semble pas valide.';
        else if (!s.msg.trim()) err = 'Merci d’écrire votre message.';
        else if (!s.ok) err = 'Merci de cocher la case d’accord pour l’utilisation de vos données.';
        self.setState(err ? { err: err } : { err: '', sent: true });
      },
      again: function () { self.setState({ sent: false, err: '', name: '', tel: '', mail: '', type: 'Question', animal: 'Chien', msg: '', ok: false }); }
    };
  }
}
</script>
