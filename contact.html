<script type="text/x-dc" id="dc-code">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sent: false, err: '', name: '', tel: '', mail: '', type: 'Question', animal: 'Chien', msg: '', ok: false };
  }
  renderVals() {
    var s = this.state, self = this;
    var set = function (k) { return function (e) { var o = {}; o[k] = e.target.value; self.setState(o); }; };
    return {
      sent: s.sent, notSent: !s.sent, err: s.err, hasErr: !!s.err,
      setName: set('name'), setTel: set('tel'), setMail: set('mail'), setType: set('type'), setAnimal: set('animal'), setMsg: set('msg'),
      setOk: function (e) { self.setState({ ok: e.target.checked }); },
      send: function () {
        var err = '';
        if (!s.name.trim()) err = 'Merci d’indiquer votre nom.';
        else if (!s.tel.trim() && !s.mail.trim()) err = 'Merci d’indiquer un téléphone ou un e-mail pour que je puisse vous répondre.';
        else if (s.mail.trim() && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(s.mail.trim())) err = 'L’adresse e-mail ne semble pas valide.';
        else if (!s.msg.trim()) err = 'Merci d’écrire votre message.';
        else if (!s.ok) err = 'Merci de cocher la case d’accord pour l’utilisation de vos données.';
        self.setState(err ? { err: err } : { err: '', sent: true });
      },
      again: function () { self.setState({ sent: false, err: '', name: '', tel: '', mail: '', type: 'Question', animal: 'Chien', msg: '', ok: false }); }
    };
  }
}
</script>
