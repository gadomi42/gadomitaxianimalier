.ct-okic{width:56px;height:56px;border-radius:50%;background:#F5B82E;color:#16302E;display:grid;place-items:center}
.ct-okic svg{width:28px;height:28px}
.ct-ok p{margin:0;font-size:16px;line-height:1.55;color:#3A4644}
.ct-ok p a{color:#16302E;font-weight:600;text-decoration:none;white-space:nowrap}
.ct-again{margin-top:6px;height:48px;padding:0 22px;border-radius:14px;border:1px solid #16302E;background:#FFFFFF;color:#16302E;font:inherit;font-size:16px;cursor:pointer}

.ct-fil{position:absolute;left:min(8.33vw, 120px);bottom:min(4.44vw, 64px);height:min(13.2vw, 190px);width:auto;pointer-events:none;z-index:0;opacity:.5}

/* ===== Formulaire de réservation (extension Gadomi Réservation) ===== */
/* Gadomi Réservation : formulaire à gauche, ticket de course à droite (empilés sur mobile). Couleurs fixes, lisibles quel que soit le thème du site. */
#gadomi-resa{
  --gd-paper:#f6f7f4;      /* fond de page */
  --gd-panel:#ffffff;      /* cartes */
  --gd-ink:#16302e;        /* texte principal, vert sapin très sombre */
  --gd-muted:#5b6f6c;      /* texte secondaire */
  --gd-line:#d9e1de;       /* filets */
  --gd-soft:#eef2ef;       /* champs, puces */
  --gd-accent:#f5b82e;     /* jaune taxi */
  --gd-accent-ink:#1b1606; /* texte sur jaune */
  --gd-teal:#1f6b63;       /* liens, état actif */
  --gd-warn:#a4520c;       /* avertissements */
  --gd-ok:#2f7a3d;         /* remise */
  --gd-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --gd-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
}

#gadomi-resa{--r:14px;font-family:var(--gd-body);color:var(--gd-ink);font-size:15px;line-height:1.45;max-width:1080px;margin:0 auto;box-sizing:border-box}
#gadomi-resa *,#gadomi-resa *::before,#gadomi-resa *::after{box-sizing:border-box}
#gadomi-resa .head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:8px 24px;margin-bottom:18px}
#gadomi-resa .eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gd-teal);margin:0 0 4px}
#gadomi-resa h2{font-family:var(--gd-display);font-weight:800;font-size:clamp(26px,4vw,38px);line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.01em}
#gadomi-resa h2 mark{background:linear-gradient(transparent 58%, var(--gd-accent) 58%, var(--gd-accent) 92%, transparent 92%);color:inherit;padding:0 .08em}
#gadomi-resa .head p{margin:0;color:var(--gd-muted);max-width:40ch;font-size:14px}

#gadomi-resa .grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){#gadomi-resa .grid{grid-template-columns:minmax(0,1fr)}}

#gadomi-resa .form{background:var(--gd-panel);border:1px solid var(--gd-line);border-radius:var(--r);padding:22px;display:grid;gap:22px;min-width:0}
#gadomi-resa fieldset{border:0;margin:0;padding:0;min-width:0;display:grid;gap:10px}
#gadomi-resa legend{font-family:var(--gd-display);font-weight:700;font-size:17px;padding:0;margin-bottom:10px;display:flex;gap:10px;align-items:baseline}
#gadomi-resa legend small{font-family:var(--gd-body);font-weight:500;font-size:13px;color:var(--gd-muted)}
#gadomi-resa label{font-size:13px;font-weight:600;color:var(--gd-ink)}
#gadomi-resa .hint{font-size:12.5px;color:var(--gd-muted);margin:0}

#gadomi-resa .seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;background:var(--gd-soft);padding:5px;border-radius:12px}
@media (max-width:520px){#gadomi-resa .seg{grid-template-columns:minmax(0,1fr)}}
#gadomi-resa .seg button{all:unset;cursor:pointer;border-radius:9px;padding:10px 12px;display:grid;gap:2px;color:var(--gd-ink)}
#gadomi-resa .seg button b{font-weight:700;font-size:14px}
#gadomi-resa .seg button span{font-size:12px;color:var(--gd-muted)}
#gadomi-resa .seg button[aria-pressed="true"]{background:var(--gd-panel);box-shadow:0 1px 0 var(--gd-line),0 0 0 2px var(--gd-teal) inset}
#gadomi-resa .seg button:focus-visible{outline:2px solid var(--gd-teal);outline-offset:2px}

#gadomi-resa .tabs{display:inline-flex;gap:4px;background:var(--gd-soft);border-radius:999px;padding:4px;justify-self:start}
#gadomi-resa .tabs button{all:unset;cursor:pointer;font-size:13px;font-weight:600;padding:6px 14px;border-radius:999px;color:var(--gd-muted)}
#gadomi-resa .tabs button[aria-pressed="true"]{background:var(--gd-panel);color:var(--gd-ink);box-shadow:0 0 0 1px var(--gd-line)}
#gadomi-resa .tabs button:focus-visible{outline:2px solid var(--gd-teal);outline-offset:2px}

#gadomi-resa .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
#gadomi-resa .field{display:grid;gap:5px;position:relative;min-width:0}
#gadomi-resa input[type=text],#gadomi-resa input[type=number],#gadomi-resa input[type=datetime-local],#gadomi-resa select{
  width:100%;font:inherit;font-size:15px;color:var(--gd-ink);background:var(--gd-soft);border:1px solid transparent;border-radius:10px;padding:10px 12px;min-height:44px}
#gadomi-resa input:focus,#gadomi-resa select:focus{outline:none;border-color:var(--gd-teal);background:var(--gd-panel)}
#gadomi-resa .km{position:relative}
#gadomi-resa .km input{padding-right:40px;font-variant-numeric:tabular-nums}
#gadomi-resa .km::after{content:"km";position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--gd-muted);pointer-events:none}

#gadomi-resa .sugg{position:absolute;left:0;right:0;top:100%;z-index:20;margin:4px 0 0;padding:4px;list-style:none;background:var(--gd-panel);border:1px solid var(--gd-line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.12);max-height:240px;overflow:auto}
#gadomi-resa .sugg li{padding:8px 10px;border-radius:7px;cursor:pointer;font-size:14px}
#gadomi-resa .sugg li small{display:block;color:var(--gd-muted);font-size:12px}
#gadomi-resa .sugg li[aria-selected="true"],#gadomi-resa .sugg li:hover{background:var(--gd-soft)}

#gadomi-resa .chips{display:flex;flex-wrap:wrap;gap:6px}
#gadomi-resa .chips button{all:unset;cursor:pointer;font-size:13.5px;font-weight:600;padding:8px 13px;border-radius:999px;background:var(--gd-soft);color:var(--gd-ink);border:1px solid transparent}
#gadomi-resa .chips button[aria-pressed="true"]{border-color:var(--gd-teal);background:var(--gd-panel);color:var(--gd-teal)}
#gadomi-resa .chips button:focus-visible{outline:2px solid var(--gd-teal);outline-offset:2px}

#gadomi-resa .stepper{display:inline-flex;align-items:center;gap:0;background:var(--gd-soft);border-radius:10px;justify-self:start}
#gadomi-resa .stepper button{all:unset;cursor:pointer;width:40px;height:40px;display:grid;place-items:center;font-size:18px;font-weight:700;border-radius:10px}
#gadomi-resa .stepper button:hover{background:var(--gd-line)}
#gadomi-resa .stepper button:focus-visible{outline:2px solid var(--gd-teal)}
#gadomi-resa .stepper output{min-width:28px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}

#gadomi-resa .toggle{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:10px;background:var(--gd-soft);cursor:pointer}
#gadomi-resa .toggle input{appearance:none;flex:none;width:38px;height:22px;border-radius:999px;background:var(--gd-line);position:relative;margin:1px 0 0;cursor:pointer;transition:background .15s}
#gadomi-resa .toggle input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--gd-panel);transition:transform .15s}
#gadomi-resa .toggle input:checked{background:var(--gd-teal)}
#gadomi-resa .toggle input:checked::after{transform:translateX(16px)}
#gadomi-resa .toggle input:focus-visible{outline:2px solid var(--gd-teal);outline-offset:2px}
#gadomi-resa .toggle span{display:grid;gap:2px;font-size:14px;font-weight:600}
#gadomi-resa .toggle span small{font-weight:400;font-size:12.5px;color:var(--gd-muted)}
#gadomi-resa .toggle em{font-style:normal;color:var(--gd-teal);font-weight:700}

#gadomi-resa .status{font-size:12.5px;color:var(--gd-muted);min-height:1.2em}
#gadomi-resa .status.err{color:var(--gd-warn)}

/* Ticket */
#gadomi-resa .ticket{position:sticky;top:16px;background:var(--gd-panel);border:1px solid var(--gd-line);border-radius:var(--r);overflow:hidden;min-width:0}
@media (max-width:820px){#gadomi-resa .ticket{position:static}}
#gadomi-resa .ticket-top{background:var(--gd-accent);color:var(--gd-accent-ink);padding:18px 20px 16px}
#gadomi-resa .ticket-top .kind{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
#gadomi-resa .price{font-family:var(--gd-display);font-weight:800;font-size:clamp(44px,7vw,58px);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:6px 0 4px}
#gadomi-resa .price small{font-size:.42em;font-weight:700;letter-spacing:0}
#gadomi-resa .ticket-top p{margin:0;font-size:13px;font-weight:500}
#gadomi-resa .perf{height:14px;background:radial-gradient(circle at 7px -1px, var(--gd-accent) 6px, transparent 6.5px) 0 0/14px 14px repeat-x}
#gadomi-resa .ticket-body{padding:6px 20px 20px;display:grid;gap:16px}

#gadomi-resa .route{list-style:none;margin:0;padding:0;display:grid;gap:0}
#gadomi-resa .route li{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;font-size:13.5px;position:relative;padding:5px 0}
#gadomi-resa .route li::before{content:"";width:10px;height:10px;border-radius:50%;border:2px solid var(--gd-teal);background:var(--gd-panel);justify-self:center;z-index:1}
#gadomi-resa .route li.base::before{background:var(--gd-teal)}
#gadomi-resa .route li:not(:last-child)::after{content:"";position:absolute;left:6px;top:50%;height:100%;border-left:2px dotted var(--gd-line)}
#gadomi-resa .route li .leg{color:var(--gd-muted);font-variant-numeric:tabular-nums;font-size:12.5px}
#gadomi-resa .tip{display:inline-grid;place-items:center;width:18px;height:18px;margin-left:5px;vertical-align:-3px;color:var(--gd-teal);cursor:help;border-radius:50%;flex:none}
#gadomi-resa .tip svg{width:17px;height:17px}
#gadomi-resa .tip:hover,#gadomi-resa .tip:focus-visible,#gadomi-resa .tip.on{color:var(--gd-ink);outline:none}
#gadomi-resa .route-sub{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--gd-muted);margin:2px 0 6px}
#gadomi-resa .route-sub span{display:inline-flex;align-items:center}
.gd-tipbox{position:fixed;z-index:9999;max-width:280px;padding:10px 12px;border-radius:10px;background:#16302E;color:#fff;font:500 13px/1.45 "Figtree","Segoe UI",system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.22);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
.gd-tipbox.show{opacity:1;transform:none}
.gd-tipbox{white-space:pre-line}
.gd-tipbox::after{content:"";position:absolute;left:var(--ax,50%);width:10px;height:10px;background:#16302E;transform:translateX(-50%) rotate(45deg)}
.gd-tipbox.below::after{top:-5px}.gd-tipbox.above::after{bottom:-5px}
#gadomi-resa .route-head{display:flex;justify-content:space-between;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gd-muted)}
#gadomi-resa .route-head span:last-child{font-variant-numeric:tabular-nums;color:var(--gd-ink)}

#gadomi-resa .lines{margin:0;padding:12px 0 0;border-top:1px dashed var(--gd-line);display:grid;gap:7px}
#gadomi-resa .lines div{display:flex;justify-content:space-between;gap:12px;font-size:14px}
#gadomi-resa .lines dt{color:var(--gd-ink);min-width:0}
#gadomi-resa .lines dt small{display:block;color:var(--gd-muted);font-size:12px}
#gadomi-resa .lines dd{margin:0;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
#gadomi-resa .lines .minus dd{color:var(--gd-ok)}
#gadomi-resa .lines .total{border-top:1px solid var(--gd-line);padding-top:8px;margin-top:2px;font-weight:700}
#gadomi-resa .lines .total dd{font-weight:800}

#gadomi-resa .notes{display:grid;gap:6px;margin:0;padding:0;list-style:none;font-size:12.5px;color:var(--gd-muted)}
#gadomi-resa .notes li{padding-left:16px;position:relative}
#gadomi-resa .notes li::before{content:"";position:absolute;left:3px;top:.6em;width:5px;height:5px;border-radius:50%;background:var(--gd-line)}
#gadomi-resa .notes li.warn{color:var(--gd-warn)}
#gadomi-resa .notes li.warn::before{background:var(--gd-warn)}
#gadomi-resa .cta{display:grid;gap:6px;justify-items:center;text-align:center;font-size:12.5px;color:var(--gd-muted);padding-top:4px}
#gadomi-resa .callbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;padding:12px 18px;border-radius:12px;background:var(--gd-accent);color:var(--gd-accent-ink);font-family:var(--gd-display);font-weight:700;font-size:18px;text-decoration:none;box-shadow:0 2px 0 rgba(0,0,0,.18);transition:transform .12s ease, box-shadow .12s ease}
#gadomi-resa .callbtn:hover{transform:translateY(-1px);box-shadow:0 4px 0 rgba(0,0,0,.18)}
#gadomi-resa .callbtn:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
#gadomi-resa .callbtn:focus-visible{outline:3px solid var(--gd-teal);outline-offset:2px}
#gadomi-resa .cta .tel{font-family:var(--gd-display);font-weight:700;font-size:20px;letter-spacing:.03em;color:var(--gd-ink);user-select:all;font-variant-numeric:tabular-nums}
#gadomi-resa .blocked .price{font-size:30px;line-height:1.15}
@media (prefers-reduced-motion:no-preference){
  #gadomi-resa .price{transition:transform .18s ease}
  #gadomi-resa .price.bump{transform:scale(1.04)}
}

/* ----- Réservation ----- */
#gadomi-resa textarea{width:100%;font:inherit;font-size:15px;color:var(--gd-ink);background:var(--gd-soft);border:1px solid transparent;border-radius:10px;padding:10px 12px;min-height:80px;resize:vertical}
#gadomi-resa input[type=date],#gadomi-resa input[type=email],#gadomi-resa input[type=tel]{width:100%;font:inherit;font-size:15px;color:var(--gd-ink);background:var(--gd-soft);border:1px solid transparent;border-radius:10px;padding:10px 12px;min-height:44px}
#gadomi-resa textarea:focus,#gadomi-resa input[type=date]:focus,#gadomi-resa input[type=email]:focus,#gadomi-resa input[type=tel]:focus{outline:none;border-color:var(--gd-teal);background:var(--gd-panel)}
#gadomi-resa .req{color:var(--gd-warn)}
#gadomi-resa .slots{display:flex;flex-wrap:wrap;gap:6px;min-height:24px}
#gadomi-resa .slots button{all:unset;cursor:pointer;font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;padding:8px 12px;border-radius:9px;background:var(--gd-soft);border:1px solid transparent;color:var(--gd-ink)}
#gadomi-resa .slots button:hover{border-color:var(--gd-line)}
#gadomi-resa .slots button[aria-pressed="true"]{background:var(--gd-teal);color:#fff}
#gadomi-resa .slots button:focus-visible{outline:2px solid var(--gd-teal);outline-offset:2px}
#gadomi-resa .slots .empty{font-size:13px;color:var(--gd-muted)}
#gadomi-resa .daybox{display:grid;gap:8px;padding:12px;border-radius:10px;border:1px dashed var(--gd-line)}
#gadomi-resa .daybox h4{margin:0;font-size:14px;font-weight:700;color:var(--gd-ink)}
#gadomi-resa .check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;font-weight:500;cursor:pointer}
#gadomi-resa .check input{margin-top:3px;width:18px;height:18px;accent-color:var(--gd-teal);flex:none}
#gadomi-resa .hp{position:absolute!important;left:-9999px!important;width:1px;height:1px;overflow:hidden}
#gadomi-resa .bookbtn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;padding:12px 18px;border-radius:12px;background:var(--gd-teal);color:#fff;font-family:var(--gd-display);font-weight:700;font-size:18px;text-align:center}
#gadomi-resa .bookbtn:hover{filter:brightness(1.08)}
#gadomi-resa .bookbtn:focus-visible{outline:3px solid var(--gd-accent);outline-offset:2px}
#gadomi-resa .bookbtn[aria-disabled="true"]{background:var(--gd-line);color:var(--gd-muted);cursor:not-allowed;filter:none}
#gadomi-resa .missing{font-size:12.5px;color:var(--gd-muted);text-align:center;margin:0}
#gadomi-resa .callbtn.secondary{background:var(--gd-soft);color:var(--gd-ink);box-shadow:none;font-size:16px;min-height:46px}
#gadomi-resa .alert{border-radius:var(--r);padding:14px 16px;margin-bottom:16px;font-size:14.5px;border:1px solid var(--gd-line);background:var(--gd-panel);color:var(--gd-ink)}
#gadomi-resa .alert.ok{border-color:var(--gd-ok);background:#eef7ef}
#gadomi-resa .alert.err{border-color:var(--gd-warn);background:#fbf1e8}
#gadomi-resa .alert b{display:block;font-family:var(--gd-display);font-size:18px;margin-bottom:2px}
#gadomi-resa .formerr{color:var(--gd-warn);font-size:13.5px;font-weight:600;margin:0;text-align:center}
#gadomi-resa .done{display:grid;gap:12px;justify-items:start;background:var(--gd-panel);border:1px solid var(--gd-line);border-radius:var(--r);padding:28px;color:var(--gd-ink)}
#gadomi-resa .done h3{font-family:var(--gd-display);font-size:26px;margin:0}
#gadomi-resa .done p{margin:0;max-width:56ch}
#gadomi-resa .done .ref{font-variant-numeric:tabular-nums;font-weight:700;background:var(--gd-soft);padding:4px 10px;border-radius:8px}
#gadomi-resa .spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:gdspin .7s linear infinite;vertical-align:-2px}
@keyframes gdspin{to{transform:rotate(360deg)}}
#gadomi-resa .ticket.loading .price{opacity:.45}
#gadomi-resa .empty-ticket{font-size:14px;color:var(--gd-muted);margin:0}

/* Protection contre les styles du thème WordPress */
#gadomi-resa [hidden]{display:none!important}
#gadomi-resa ul,#gadomi-resa ol{margin:0;padding:0;list-style:none}
#gadomi-resa .notes li{margin:0}
#gadomi-resa fieldset legend{float:none;width:auto}
#gadomi-resa button{text-transform:none;letter-spacing:normal}
#gadomi-resa .route li{grid-template-columns:14px minmax(0,1fr) auto}

#gadomi-resa .subgroup{display:grid;gap:8px;margin-top:6px}
#gadomi-resa .sublabel{margin:0;font-size:13px;font-weight:600;color:var(--gd-ink)}
#gadomi-resa .seg button:disabled{cursor:default}
#gadomi-resa .toggle small.oblig{color:var(--gd-teal);font-weight:600}
#gadomi-resa .toggle input:disabled{opacity:.9;cursor:not-allowed}
#gadomi-resa .toggle:has(input:disabled){cursor:default}

/* Distance calculée, mise en valeur */
#gadomi-resa .dist{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:12px;background:#e6f1ef;border:1px solid #bcd9d4;color:var(--gd-teal)}
#gadomi-resa .dist svg{flex:none}
#gadomi-resa .dist > div{display:grid;gap:0;min-width:0;flex:1}
#gadomi-resa .dist-label{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
#gadomi-resa .dist-km{font-family:var(--gd-display);font-size:26px;line-height:1.1;color:var(--gd-ink);font-variant-numeric:tabular-nums}
#gadomi-resa .dist-km b{font-weight:800}
#gadomi-resa .dist-sub{font-size:12.5px;color:var(--gd-muted)}
#gadomi-resa .dist-type{font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--gd-panel);border:1px solid #bcd9d4;white-space:nowrap}
#gadomi-resa .dist.longue .dist-type{background:var(--gd-accent);border-color:var(--gd-accent);color:var(--gd-accent-ink)}

#gadomi-resa .animal1{display:grid;gap:10px}
#gadomi-resa .animal1.boxed{padding:12px;border-radius:10px;border:1px dashed var(--gd-line)}
#gadomi-resa .animal1 .row{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
#gadomi-resa .animal1 h4{margin:0;font-size:14px;font-weight:700;color:var(--gd-ink)}
#gadomi-resa .autres{display:grid;gap:12px}
#gadomi-resa .autre{display:grid;gap:8px;padding:12px;border-radius:10px;border:1px dashed var(--gd-line)}
#gadomi-resa .autre h4{margin:0;font-size:14px;font-weight:700;color:var(--gd-ink)}
#gadomi-resa .autre .row{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}

/* Habillage Gadomi : couleurs, police et formes du site */
#gadomi-resa{
  --gd-paper:#F7F6F2;--gd-panel:#FFFFFF;--gd-ink:#16302E;--gd-muted:#5B6B69;--gd-line:#D9DEDC;--gd-soft:#F7F6F2;

  --gd-display:"Outfit",sans-serif;--gd-body:"Outfit",sans-serif;--r:20px;
  max-width:none;font-size:16px;color:#16302E}
.rs-main #gadomi-resa{margin-top:calc(-1 * min(4.44vw, 64px));position:relative;z-index:2}
#gadomi-resa .grid{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:min(1.67vw, 24px)}
#gadomi-resa .form{border:0;border-radius:20px;padding:min(2.78vw, 40px);gap:36px;box-shadow:0 8px 28px rgba(22,48,46,.10)}
#gadomi-resa legend{font-weight:600;font-size:22px;margin-bottom:14px;color:#16302E}
#gadomi-resa legend small{font-weight:400;font-size:14px}
#gadomi-resa label,#gadomi-resa .sublabel{font-size:15px;font-weight:500}
#gadomi-resa .hint{font-size:14px}
#gadomi-resa input[type=text],#gadomi-resa input[type=number],#gadomi-resa input[type=datetime-local],#gadomi-resa input[type=date],#gadomi-resa input[type=email],#gadomi-resa input[type=tel],#gadomi-resa select,#gadomi-resa textarea{
  background:#FFFFFF;border:1px solid #D9DEDC;border-radius:12px;padding:13px 14px;min-height:50px;font-weight:300;font-size:16px}
#gadomi-resa input:focus,#gadomi-resa select:focus,#gadomi-resa textarea:focus,#gadomi-resa input[type=date]:focus,#gadomi-resa input[type=email]:focus,#gadomi-resa input[type=tel]:focus{outline:2px solid #F5B82E;outline-offset:1px;border-color:#F5B82E;background:#FFFFFF}
#gadomi-resa input::placeholder,#gadomi-resa textarea::placeholder{color:#A3A3A3}
#gadomi-resa .seg{background:#F7F6F2;border-radius:16px;padding:6px;gap:6px}
#gadomi-resa .seg button{border-radius:12px;padding:12px 14px}
#gadomi-resa .seg button b{font-weight:600;font-size:16px}
#gadomi-resa .seg button span{font-size:13px}
#gadomi-resa .seg button[aria-pressed="true"]{background:#FEF3D7;box-shadow:0 0 0 2px #F5B82E inset}
#gadomi-resa .chips button{font-weight:500;font-size:15px;padding:10px 16px;background:#F7F6F2}
#gadomi-resa .chips button[aria-pressed="true"]{background:#FEF3D7;border-color:#F5B82E;color:#16302E}
#gadomi-resa .stepper{background:#F7F6F2;border-radius:12px}
#gadomi-resa .toggle{background:#F7F6F2;border-radius:14px;padding:14px 16px}
#gadomi-resa .toggle span{font-size:15px;font-weight:500}
#gadomi-resa .toggle span small{font-size:13.5px}
#gadomi-resa .toggle input:checked{background:#16302E}
#gadomi-resa .toggle em{color:#16302E;font-weight:600}
#gadomi-resa .toggle small.oblig{color:#16302E}
#gadomi-resa .daybox,#gadomi-resa .autre,#gadomi-resa .animal1.boxed{border-radius:14px;border:1px solid #D9DEDC;padding:16px}
#gadomi-resa .slots button{font-weight:500;padding:9px 14px;border-radius:12px;background:#F7F6F2}
#gadomi-resa .slots button[aria-pressed="true"]{background:#16302E;color:#FFFFFF}
#gadomi-resa .check{font-size:14.5px;font-weight:400;color:#3A4644}
#gadomi-resa .check input{accent-color:#16302E}
#gadomi-resa .dist{background:#FEF3D7;border:1px solid #F5D78A;border-radius:14px;color:#16302E;padding:14px 16px}
#gadomi-resa .dist-km{font-size:28px}#gadomi-resa .dist-km b{font-weight:600}
#gadomi-resa .dist-label{font-weight:600}
#gadomi-resa .dist-type{border-color:#F5D78A;font-weight:600}
#gadomi-resa .ticket{border:0;border-radius:20px;box-shadow:0 8px 28px rgba(22,48,46,.10);top:24px}
#gadomi-resa .ticket-top{padding:22px 24px 18px}
#gadomi-resa .ticket-top .kind{font-weight:600}
#gadomi-resa .price{font-weight:600;letter-spacing:-.01em}
#gadomi-resa .price small{font-weight:500}
#gadomi-resa .ticket-body{padding:8px 24px 24px;gap:18px}
#gadomi-resa .route li{font-size:14.5px}
#gadomi-resa .route-head{font-weight:600}
#gadomi-resa .lines div{font-size:15px}
#gadomi-resa .lines .total dd{font-weight:600}
#gadomi-resa .notes{font-size:13.5px}
#gadomi-resa .notes li::before{background:#F5B82E}
#gadomi-resa .bookbtn,#gadomi-resa .callbtn{min-height:56px;border-radius:16px;background:#F5B82E;color:#1B1606;font-family:"Outfit",sans-serif;font-weight:500;font-size:18px;box-shadow:none;transform:none}
#gadomi-resa .bookbtn:hover,#gadomi-resa .callbtn:hover{background:#FFC74A;filter:none;transform:none;box-shadow:none}
#gadomi-resa .bookbtn[aria-disabled="true"]{background:#EDEFEE;color:#8A9694}
#gadomi-resa .callbtn.secondary{background:#FFFFFF;border:1px solid #16302E;color:#16302E;font-size:16px;min-height:48px}
#gadomi-resa .cta .tel{font-weight:600}
#gadomi-resa .tip{color:#5B6B69}
#gadomi-resa .tip:hover,#gadomi-resa .tip.on{color:#16302E}
.gd-tipbox{font:400 14px/1.5 "Outfit",sans-serif;border-radius:12px;max-width:300px}
#gadomi-resa .done,#gadomi-resa .alert{border:0;border-radius:20px}
#gadomi-resa .done h3,#gadomi-resa .alert b{font-weight:600}
@media (max-width:820px){
  #gadomi-resa .grid{grid-template-columns:minmax(0,1fr);gap:16px}
  .rs-main #gadomi-resa{margin-top:-56px}
  #gadomi-resa .form{padding:22px 18px;border-radius:18px;gap:30px}
  #gadomi-resa legend{font-size:20px}
  #gadomi-resa .ticket{border-radius:18px}
}
#gadomi-resa .status:empty{display:none}
#gadomi-resa .toggle > span{display:block;line-height:1.45}
#gadomi-resa .toggle > span > small{display:block;margin-top:2px}
#gadomi-resa .toggle > span > em{margin-left:6px}
#gadomi-resa .toggle span.tip{display:inline-grid;vertical-align:-3px}
#gadomi-resa .toggle > span > em{white-space:nowrap}
@media (max-width:520px){
  #gadomi-resa .animal1 .row{grid-template-columns:1fr 1fr}
  #gadomi-resa .animal1 .row > .field:last-child{grid-column:1 / -1}
}

.rs-demo{position:relative;z-index:3;margin:0 0 14px;padding:10px 14px;border-radius:12px;background:#FEF3D7;color:#3A4644;font-size:14px;line-height:1.45}.rs-demo b{color:#16302E}</style>

<main class="tf-main rs-main">
<p class="rs-demo"><b>Aperçu :</b> tapez une ville de démonstration (Balbigny, Montbrison, Roanne, Saint-Étienne, Lyon, Grenoble, Marseille, Paris, Genève, Lausanne, Turin, Milan, Barcelone…). Les créneaux sont fictifs et rien n’est envoyé.</p><section id="gadomi-resa" data-dc-keep aria-labelledby="gd-title">
		<h2 id="gd-title" hidden>Réserver votre trajet</h2>
	<div class="grid" id="gd-app">
		<form class="form" id="gd-form" novalidate>
			<fieldset>
				<legend>1. Le trajet <small id="gd-mode-hint"></small></legend>
				<div class="row">
					<div class="field">
						<label for="gd-a1">Adresse de prise en charge <span class="req">*</span></label>
						<input type="text" id="gd-a1" autocomplete="off" placeholder="Ville ou adresse, ex. Balbigny" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="gd-s1">
						<ul class="sugg" id="gd-s1" role="listbox" hidden></ul>
					</div>
					<div class="field">
						<label for="gd-a2">Destination <span class="req">*</span></label>
						<input type="text" id="gd-a2" autocomplete="off" placeholder="Ville ou adresse, ex. Montbrison" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="gd-s2">
						<ul class="sugg" id="gd-s2" role="listbox" hidden></ul>
					</div>
				</div>
				<p class="hint">Les distances sont calculées au départ et au retour de Feurs. <span style="white-space:nowrap"><span class="tip" tabindex="0" role="button" aria-label="En savoir plus" data-tip="Jusqu&#x27;à 65 km, l&#x27;itinéraire est calculé sans péage. Au-delà de 65 km, il passe par l&#x27;autoroute et les péages sont inclus dans le prix. Le carburant est inclus dans le prix de tous les trajets, local comme longue distance."><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="7.6" r="1.25" fill="currentColor"/></svg></span></span></p>
				<div class="dist" id="gd-dist" hidden aria-live="polite">
					<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM18 9a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM6 15V9a4 4 0 0 1 4-4h2M18 9v6a4 4 0 0 1-4 4h-2"/></svg>
					<div><span class="dist-label">Itinéraire calculé</span><span class="dist-km"><b id="gd-dist-km"></b> km</span><span class="dist-sub">entre la prise en charge et la destination</span></div>
					<span class="dist-type" id="gd-dist-type"></span>
				</div>
				<p class="status" id="gd-status" aria-live="polite"></p>
			</fieldset>

			<fieldset>
				<legend>2. Le type de trajet</legend>
				<div class="seg" role="group" aria-label="Type de trajet">
					<button type="button" data-zone="local" aria-pressed="true"><b>Trajet local<span class="tip" tabindex="0" role="button" aria-label="En savoir plus" data-tip="Le trajet de votre animal, de chez vous à la destination, fait moins de 65 km. Prise en charge jusqu&#x27;à 50 km autour de Feurs, au-delà sur devis."><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="7.6" r="1.25" fill="currentColor"/></svg></span></b><span>Moins de 65 km</span></button>
					<button type="button" data-zone="france" aria-pressed="false"><b>Longue distance France<span class="tip" tabindex="0" role="button" aria-label="En savoir plus" data-tip="Plus de 65 km entre chez vous et la destination. Votre animal voyage seul, péages et carburant inclus. À réserver 7 jours à l&#x27;avance."><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="7.6" r="1.25" fill="currentColor"/></svg></span></b><span>Plus de 65 km</span></button>
					<button type="button" data-zone="europe" aria-pressed="false"><b>Europe<span class="tip" tabindex="0" role="button" aria-label="En savoir plus" data-tip="Passage de frontière +40 €, vignette suisse et tunnel du Fréjus ajoutés selon la destination. Puce, passeport européen et vaccin antirabique obligatoires. À réserver 15 jours à l&#x27;avance."><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="7.6" r="1.25" fill="currentColor"/></svg></span></b><span>Suisse, Italie, Allemagne…</span></button>
				</div>
				<div id="gd-formule-wrap" class="subgroup">
					<p class="sublabel">Formule</p>
					<div class="seg" role="group" aria-label="Formule">
						<button type="button" data-formule="simple" aria-pressed="false"><b>Aller simple<span class="tip" tabindex="0" role="button" aria-label="En savoir plus" data-tip="Un seul sens, sans retour. En longue distance, c&#x27;est la seule formule proposée."><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="7.6" r="1.25" fill="currentColor"/></svg></span></b><span>Un seul sens : déménagement, aéroport, gare, adoption</span></button>
						<button type="button" data-formule="ar" aria-pressed="true"><b>Aller-retour même jour<span class="tip" tabindex="0" role="button" aria-label="En savoir plus" data-tip="J&#x27;attends sur place pendant le rendez-vous. 15 min comprises, puis 5 € par quart d&#x27;heure."><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="7.6" r="1.25" fill="currentColor"/></svg></span></b><span>Vétérinaire, toilettage : j'attends sur place</span></button>
						<button type="button" data-formule="deux" aria-pressed="false"><b>Aller-retour dates différentes<span class="tip" tabindex="0" role="button" aria-label="En savoir plus" data-tip="Deux trajets à deux dates, par exemple pour une pension, réglés en un seul prix."><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="7.6" r="1.25" fill="currentColor"/></svg></span></b><span>Départ un jour, retour un autre : pension</span></button>
					</div>
				</div>
				<p class="hint" id="gd-zone-hint" hidden></p>
				<p class="hint" id="gd-zone-lock" hidden>Le type de trajet est déterminé par les adresses indiquées. Pour le changer, modifiez le trajet.</p>
			</fieldset>

			<fieldset>
				<legend id="gd-animal-legend">3. Votre animal</legend>
				<div class="row" style="align-items:end">
					<div class="field">
						<label id="gd-nb-lbl">Nombre d'animaux du foyer<span class="tip" tabindex="0" role="button" aria-label="En savoir plus" data-tip="2 animaux maximum d&#x27;un même foyer, selon leur taille. +5 € en local, +20 € en longue distance."><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="7.6" r="1.25" fill="currentColor"/></svg></span></label>
						<div class="stepper" role="group" aria-labelledby="gd-nb-lbl">
							<button type="button" id="gd-nb-minus" aria-label="Un animal de moins">−</button>
							<output id="gd-nb" aria-live="polite">1</output>
							<button type="button" id="gd-nb-plus" aria-label="Un animal de plus">+</button>
						</div>
					</div>
					<div class="field">

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sent: false, err: '', name: '', tel: '', mail: '', type: 'Question', animal: 'Chien', msg: '', ok: false };
  }
  renderVals() {
    var s = this.state, self = this;
    var set = function (k) { return function (e) { var o = {}; o[k] = e.target.value; self.setState(o); }; };
    return {
      sent: s.sent, notSent: !s.sent, err: s.err, hasErr: !!s.err,
      setName: set('name'), setTel: set('tel'), setMail: set('mail'), setType: set('type'), setAnimal: set('animal'), setMsg: set('msg'),
      setOk: function (e) { self.setState({ ok: e.target.checked }); },
      send: function () {
        var err = '';
        if (!s.name.trim()) err = 'Merci d’indiquer votre nom.';
        else if (!s.tel.trim() && !s.mail.trim()) err = 'Merci d’indiquer un téléphone ou un e-mail pour que je puisse vous répondre.';
        else if (s.mail.trim() && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(s.mail.trim())) err = 'L’adresse e-mail ne semble pas valide.';
        else if (!s.msg.trim()) err = 'Merci d’écrire votre message.';
        else if (!s.ok) err = 'Merci de cocher la case d’accord pour l’utilisation de vos données.';
        self.setState(err ? { err: err } : { err: '', sent: true });
      },
      again: function () { self.setState({ sent: false, err: '', name: '', tel: '', mail: '', type: 'Question', animal: 'Chien', msg: '', ok: false }); }
    };
  }
}

  ['gd-prenom', 'gd-nom', 'gd-adr', 'gd-ville', 'gd-tel', 'gd-email', 'gd-cgv'].forEach(function (id) { $(id).addEventListener('input', checkReady); $(id).addEventListener('change', checkReady); });

  syncVisibility();
  checkReady();
})();

/* Info-bulles : survol sur ordinateur, toucher sur téléphone. */
(function () {
  var root = document.getElementById('gadomi-resa'); if (!root) return;
  var box = document.createElement('div'); box.className = 'gd-tipbox'; box.setAttribute('role', 'tooltip'); document.body.appendChild(box);
  var cur = null;
  function show(t) {
    cur = t; root.querySelectorAll('.tip.on').forEach(function (x) { x.classList.remove('on'); }); t.classList.add('on');
    box.textContent = t.getAttribute('data-tip'); box.className = 'gd-tipbox';
    var r = t.getBoundingClientRect(), w = Math.min(280, window.innerWidth - 24); box.style.maxWidth = w + 'px';
    var bw = box.offsetWidth, bh = box.offsetHeight, cx = r.left + r.width / 2;
    var left = Math.max(12, Math.min(window.innerWidth - bw - 12, cx - bw / 2));
    var below = r.top - bh - 12 < 8;
    box.style.left = left + 'px'; box.style.top = (below ? r.bottom + 10 : r.top - bh - 10) + 'px';
    box.style.setProperty('--ax', (cx - left) + 'px'); box.classList.add(below ? 'below' : 'above', 'show');
  }
  function hide() { if (cur) cur.classList.remove('on'); cur = null; box.classList.remove('show'); }
  root.addEventListener('mouseover', function (e) { var t = e.target.closest && e.target.closest('.tip'); if (t && matchMedia('(hover:hover)').matches) show(t); });
  root.addEventListener('mouseout', function (e) { var t = e.target.closest && e.target.closest('.tip'); if (t && matchMedia('(hover:hover)').matches && !t.contains(e.relatedTarget)) hide(); });
  var viaPointer = false;
  root.addEventListener('pointerdown', function () { viaPointer = true; }, true);
  root.addEventListener('keydown', function () { viaPointer = false; }, true);
  root.addEventListener('focusin', function (e) { if (!viaPointer && e.target.classList && e.target.classList.contains('tip')) show(e.target); });
  root.addEventListener('focusout', function (e) { if (e.target.classList && e.target.classList.contains('tip')) hide(); });
  // Un toucher ou un clic sur l'icône ouvre ou ferme la bulle, sans cocher ni choisir l'option autour.
  root.addEventListener('click', function (e) {
    var t = e.target.closest && e.target.closest('.tip');
    if (t) { e.preventDefault(); e.stopPropagation(); if (cur === t && !matchMedia('(hover:hover)').matches) hide(); else show(t); return; }
    hide();
  }, true);
  root.addEventListener('keydown', function (e) { var t = e.target.classList && e.target.classList.contains('tip') ? e.target : null; if (t && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); e.stopPropagation(); cur === t ? hide() : show(t); } if (e.key === 'Escape') hide(); }, true);
  window.addEventListener('scroll', hide, true); window.addEventListener('resize', hide);
})();
</script>
