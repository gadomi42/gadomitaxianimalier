/* Module d'estimation : styles repris de module-estimation-gadomi.html, règles mobile (≤ 720 px) appliquées */
#gdm{--gdm-ink:#16302e;--gdm-muted:#6b7d7a;--gdm-accent:#f5b82e;--gdm-accent-hover:#ffc74a;--gdm-accent-ink:#1b1606;--gdm-dark:#16302e;--gdm-dark-ink:#f3f6f4;--gdm-dark-muted:#a9bcb8;--gdm-ok:#1f6b63;--gdm-err:#c2410c;--gdm-note:#fde7b0;--gdm-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;--gdm-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;font-family:var(--gdm-body);color:var(--gdm-ink);box-sizing:border-box}
#gdm *,#gdm *::before,#gdm *::after{box-sizing:border-box}
#gdm .bar{display:grid;grid-template-columns:1fr;background:#fff;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.18)}
#gdm .fld{min-width:0;position:relative;display:flex;flex-direction:column;justify-content:center;padding:12px 16px}
#gdm .fld + .fld{border-top:1px solid #dcdcdc}
#gdm label{display:flex;align-items:center;gap:6px;font-family:"Outfit",system-ui,sans-serif;font-size:15px;font-weight:400;letter-spacing:.04em;text-transform:uppercase;color:#555;margin-bottom:4px}
#gdm .fld.ok label{color:var(--gdm-ok)}
#gdm .chk{display:none;width:16px;height:16px;border-radius:50%;background:var(--gdm-ok);color:#fff;place-items:center}
#gdm .chk svg{width:10px;height:10px}
#gdm .fld.ok .chk{display:inline-grid}
#gdm input{all:unset;display:block;width:100%;font-family:"Outfit",system-ui,sans-serif;font-size:20px;font-weight:400;color:var(--gdm-ink);line-height:1.3;text-overflow:ellipsis;white-space:nowrap;overflow:hidden}
#gdm input::placeholder{color:#A3A3A3;font-weight:300}
#gdm .go{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;min-height:60px;background:var(--gdm-accent);color:var(--gdm-accent-ink);font-family:"Outfit",system-ui,sans-serif;font-weight:500;font-size:21px;border-radius:0 0 14px 14px;transition:background .15s}
#gdm .go:hover{background:var(--gdm-accent-hover)}
#gdm .go:focus-visible{outline:3px solid var(--gdm-accent);outline-offset:3px}
#gdm .sugg{position:absolute;left:0;right:0;top:calc(100% + 10px);z-index:50;margin:0;padding:5px;list-style:none;background:#fff;border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.2);max-height:260px;overflow:auto}
#gdm .sugg li{padding:9px 11px;border-radius:9px;cursor:pointer;font-size:14.5px;color:var(--gdm-ink)}
#gdm .sugg li small{display:block;color:var(--gdm-muted);font-size:12px}
#gdm .sugg li:hover{background:#f1f4f2}
#gdm .msg{margin:10px 6px 0;font-size:13.5px;font-weight:600;color:#000}
#gdm .msg.err{color:var(--gdm-err)}
#gdm .res{margin-top:12px;background:var(--gdm-dark);color:var(--gdm-dark-ink);border-radius:16px;padding:22px;display:flex;flex-direction:column;align-items:stretch;gap:18px;box-shadow:0 12px 40px rgba(0,0,0,.18)}
#gdm .kick{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gdm-dark-muted);margin:0}
#gdm .price{font-family:var(--gdm-display);font-weight:800;font-size:46px;line-height:1.05;letter-spacing:-.02em;margin:4px 0 8px;font-variant-numeric:tabular-nums;white-space:nowrap}
#gdm .pill{display:inline-block;background:var(--gdm-note);color:var(--gdm-accent-ink);font-size:13px;font-weight:700;padding:5px 12px;border-radius:999px;font-variant-numeric:tabular-nums}
#gdm .pts{list-style:none;margin:0;padding:0;display:grid;gap:9px;font-size:15px}
#gdm .pts li{display:flex;gap:10px;align-items:center}
#gdm .tick{flex:none;width:20px;height:20px;border-radius:50%;background:var(--gdm-accent);color:var(--gdm-accent-ink);display:inline-grid;place-items:center}
#gdm .book{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;height:64px;background:var(--gdm-accent);color:var(--gdm-accent-ink);font-family:"Outfit",system-ui,sans-serif;font-weight:500;font-size:20px;border-radius:12px;white-space:nowrap;transition:background .15s}
#gdm .book:hover{background:var(--gdm-accent-hover)}
#gdm .book:focus-visible{outline:3px solid var(--gdm-accent);outline-offset:3px}
#gdm .res.blocked .price{font-size:28px}
#gdm .foot{margin:14px 6px 0;font-family:Arial,Helvetica,sans-serif;font-size:13.5px;color:#fff}
@media (prefers-reduced-motion:no-preference){#gdm .res{animation:gdmIn .28s ease-out}@keyframes gdmIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}}

<!-- En-tête mobile -->
<header style="display: flex; align-items: center; justify-content: space-between; gap: 12px">

<img src="../assets/d052ca0c091a3d19cd5c4455eefdac21.png" alt="Gadomi Taxi Animalier" style="width: 104px; height: auto; display: block">
</a>
<div style="display: flex; align-items: center; gap: 10px">

<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"></path></svg>
</a>
<button type="button" onClick="{{openMenu}}" aria-label="Ouvrir le menu" aria-expanded="false" style="display: inline-flex; align-items: center; justify-content: center; width: 50px; height: 50px; border-radius: 999px; border: 0; background: #16302E; color: #FFFFFF; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
</button>
</div>
</header>

<!-- Titre et badges -->
<div id="accueil" style="display: flex; flex-direction: column; margin-top: 22px; text-shadow: 0 2px 14px rgba(10,30,30,0.35)">
<h1 style="margin: 0; display: flex; flex-direction: column; font-weight: 800; letter-spacing: -0.02em">
<span style="font-size: 86px; line-height: 0.92">Taxi</span>

</h1>

<p style="margin: 24px 0 0; text-align: center; font-weight: 600; font-size: 15px; line-height: 1.55">Certification ACACED + TAV &nbsp;•&nbsp; Agrément Type 1 et 2 &nbsp;•&nbsp; Véhicule agréé &nbsp;•&nbsp; Assurance &nbsp;•&nbsp; Chiens, chats, NAC</p>
</div>

<!-- Module d'estimation rapide (repris de module-estimation-gadomi.html), placé sous la camionnette -->
<div id="gdm" style="width: 100%; margin-top: 24px">
<div class="bar" role="search">
<div class="{{f1Class}}">
<label for="gdm-a1">Départ <span class="chk" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span></label>
<input type="text" id="gdm-a1" placeholder="Adresse de départ" value="{{a1}}" autocomplete="off" onChange="{{setA1}}" onKeyDown="{{key1}}" onBlur="{{blur1}}" role="combobox" aria-expanded="{{open1Str}}" aria-autocomplete="list" aria-controls="gdm-s1">
<sc-if value="{{open1}}" hint-placeholder-val="{{ false }}">
<ul class="sugg" id="gdm-s1" role="listbox">
<sc-for list="{{s1}}" as="it" hint-placeholder-count="3"><li role="option" aria-selected="false" onMouseDown="{{it.pick}}">{{it.main}}<small>{{it.sub}}</small></li></sc-for>
</ul>
</sc-if>
</div>
<div class="{{f2Class}}">
<label for="gdm-a2">Destination <span class="chk" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span></label>
